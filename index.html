<div class="gen-stream-override-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="Gen Stream Override">gen-stream-override</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="gen-stream-override-block flex-container">
                <input id="genStreamOverride_enable" type="checkbox" />
                <label for="genStreamOverride_enable" data-i18n="Enable Extension">확장 활성화</label>
            </div>
            <div class="gen-stream-override-block flex-container">
                <input id="genStreamOverride_visibleByDefault" type="checkbox" />
                <label for="genStreamOverride_visibleByDefault">바로 보이기 (visible 기본값)</label>
            </div>
            <div class="gen-stream-override-block help-block" style="padding-left: 10px; opacity: 0.8;">
                <small data-i18n="Disabling will refresh the page in 3 seconds.">사용 설정시 기존의 /gen 명령어를 스트리밍이 가능한 /gen으로 덮어씌웁니다. 복잡한 /gen 명령어와 호환되지 않을 수 있습니다.</br>
                    해제 시 설정 저장 및 반영을 위해 3초 후 페이지가 새로고침 됩니다.</small>
            </div>
            <hr class="sysHR" />
        </div>
    </div>
</div>
